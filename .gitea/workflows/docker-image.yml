name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: https://git.yolo.fail/actions/checkout@v4
    - name: Build the Docker image
      # the runner shares the host's Docker, so remove the test image afterwards
      run: |
        docker build . --file Dockerfile --tag "stageplot-ci:${{ github.run_id }}"
        docker rmi "stageplot-ci:${{ github.run_id }}"
